<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOBOR PASSPORT</title>
<style>
  body { background: #0B0B0F; color: #fff; font-family: 'Arial', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; flex-direction: column; padding: 20px;}
  
  /* Логин */
  .login-box { background: #15151B; padding: 30px; border-radius: 12px; width: 300px; border: 1px solid #26262E; }
  input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #333; background: #000; color: #fff; box-sizing: border-box; font-family:inherit;}
  button { width: 100%; padding: 12px; background: #FF3D00; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-family:inherit;}
  button:hover { opacity: 0.9; }

  /* Паспорт */
  .passport { display: none; background: #F0F0F0; color: #000; width: 100%; max-width: 600px; min-height: 380px; border-radius: 15px; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; font-family: 'Courier New', Courier, monospace; flex-direction: row; }
  
  @media(max-width: 600px) { .passport { flex-direction: column; } .left-side { width: 100% !important; border-right: none !important; border-bottom: 2px dashed #ccc; } .right-side { width: 100% !important; } }
  
  .left-side { width: 40%; background: #E5E5E5; padding: 20px; display: flex; flex-direction: column; align-items: center; border-right: 2px dashed #ccc; box-sizing: border-box;}
  .photo-box { width: 140px; height: 180px; background: #ccc; border: 2px solid #999; margin-bottom: 15px; display: flex; justify-content: center; align-items: center; color: #666; font-size: 12px; text-align: center; overflow: hidden; position: relative;}
  .photo-box img { width: 100%; height: 100%; object-fit: cover; }
  
  .upload-btn { background: #007BFF; color: #fff; font-size: 12px; padding: 8px; margin-top: 5px; width: 140px; border-radius: 6px; text-align: center; cursor: pointer; display: block;}
  input[type="file"] { display: none; }

  .code-box { margin-top: auto; text-align: center; border-top: 2px solid #999; padding-top: 10px; width: 100%; }
  .code { font-size: 24px; font-weight: bold; color: #007BFF; font-family: monospace; letter-spacing: 2px; }

  .right-side { width: 60%; padding: 20px; position: relative; box-sizing: border-box; }
  .header-title { font-size: 18px; font-weight: bold; margin-bottom: 20px; text-transform: uppercase; text-align: center; letter-spacing: 2px; }
  .data-row { margin-bottom: 12px; border-bottom: 1px solid #ccc; padding-bottom: 4px; }
  .label { font-size: 10px; color: #666; text-transform: uppercase; display: block; margin-bottom: 2px; }
  .value { font-size: 16px; font-weight: bold; word-break: break-all; }
  
  .signatures { position: absolute; bottom: 20px; right: 20px; display: flex; gap: 10px; }
  .sig-box { width: 50px; height: 40px; border: 1px solid #999; display: flex; justify-content: center; align-items: center; }
  .checkmark { color: #00C878; font-size: 24px; font-weight: bold; display: none; }

  .controls { display: none; width: 100%; max-width: 600px; margin-top: 20px; }
  .btn-admin { background: #C6FF00; color: #000; padding: 15px; font-size: 16px; border-radius: 8px; width: 100%; border: none; font-weight: bold; cursor: pointer; }

  /* Список админа */
  .admin-panel { display:none; background: #15151B; padding: 20px; border-radius: 12px; margin-top: 20px; width: 100%; max-width: 600px; border: 1px solid #C6FF00;}
  .pending-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding: 10px 0; }
  .pending-photo { width: 50px; height: 60px; background: #ccc; object-fit: cover; border-radius: 4px; }
</style>
</head>
<body>

  <!-- ЛОГИН -->
  <div class="login-box" id="login-screen">
    <h2 style="text-align:center;margin-top:0">🪪 Вход</h2>
    <input type="email" id="log-email" placeholder="Email">
    <input type="password" id="log-pass" placeholder="Пароль">
    <button onclick="doLogin()">Войти</button>
  </div>

  <!-- ПАСПОРТ -->
  <div class="passport" id="passport-card">
    <div class="left-side">
      <div class="photo-box" id="user-photo">НЕТ ФОТО</div>
      <input type="file" id="photo-input" accept="image/*" onchange="uploadPhoto(this)">
      <label for="photo-input" class="upload-btn" id="upload-label">📷 Загрузить фото</label>
      
      <div class="code-box">
        <div style="font-size:10px;color:#666;margin-bottom:5px">№</div>
        <div class="code" id="user-code">00000x</div>
      </div>
    </div>
    
    <div class="right-side">
      <div class="header-title">BOBOR PRODUCTION</div>
      
      <div class="data-row">
        <span class="label">Имя</span>
        <span class="value" id="u-name">---</span>
      </div>
      
      <div class="data-row">
        <span class="label">Почта</span>
        <span class="value" id="u-email" style="font-size:12px">---</span>
      </div>

      <div class="data-row">
        <span class="label">Дата</span>
        <span class="value" id="u-date">---</span>
      </div>

      <div class="data-row">
        <span class="label">Статус</span>
        <span class="value" id="u-status">---</span>
      </div>

      <div class="signatures">
        <div class="sig-box"><span class="checkmark" id="sig-1">✔</span></div>
        <div class="sig-box"><span class="checkmark" id="sig-2">✔</span></div>
        <div class="sig-box"><span class="checkmark" id="sig-3">✔</span></div>
      </div>
    </div>
  </div>

  <!-- АДМИН ПАНЕЛЬ -->
  <div class="admin-panel" id="admin-panel">
    <h3 style="margin-top:0; color:#C6FF00">На проверку:</h3>
    <div id="pending-list">Загрузка...</div>
  </div>

<script>
let currentUser = null;
let isAdmin = false;

function doLogin() {
  const email = document.getElementById('log-email').value;
  const password = document.getElementById('log-pass').value;
  
  fetch('/api/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ email, password })
  }).then(async r => {
    if (r.ok) {
      const data = await r.json();
      currentUser = data.user;
      if (currentUser.role === 'admin') isAdmin = true;

      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('passport-card').style.display = 'flex';
      
      // Заполняем данные
      document.getElementById('u-name').innerText = currentUser.name;
      document.getElementById('u-email').innerText = currentUser.email;
      document.getElementById('user-code').innerText = currentUser.passCode;
      document.getElementById('u-date').innerText = new Date().toLocaleDateString('ru-RU');
      
      updatePassportUI();

      // Если админ — показываем панель проверки
      if (isAdmin) {
        document.getElementById('admin-panel').style.display = 'block';
        loadPending();
      }

    } else {
      const err = await r.json();
      alert(err.error || 'Ошибка');
    }
  });
}

function updatePassportUI() {
  const p = document.getElementById('user-photo');
  
  if (currentUser.photo) {
    p.innerHTML = `<img src="${currentUser.photo}">`;
    document.getElementById('upload-label').innerText = '🔄 Изменить фото';
  } else {
    p.innerText = 'НЕТ ФОТО';
  }

  const statusText = document.getElementById('u-status');
  
  if (currentUser.status === 'approved') {
    statusText.innerText = 'ПОДТВЕРЖДЕН';
    statusText.style.color = '#00C878';
    document.getElementById('sig-1').style.display = 'block';
    document.getElementById('sig-2').style.display = 'block';
    document.getElementById('sig-3').style.display = 'block';
    document.getElementById('upload-label').style.display = 'none';
  } else if (currentUser.status === 'pending') {
    statusText.innerText = 'НА ПРОВЕРКЕ';
    statusText.style.color = '#FFB800';
    document.getElementById('sig-1').style.display = 'none';
    document.getElementById('sig-2').style.display = 'none';
    document.getElementById('sig-3').style.display = 'none';
  } else {
    statusText.innerText = 'НЕТ ФОТО';
    statusText.style.color = '#FF3D00';
    document.getElementById('sig-1').style.display = 'none';
    document.getElementById('sig-2').style.display = 'none';
    document.getElementById('sig-3').style.display = 'none';
  }
}

// Загрузка фото пользователем
function uploadPhoto(input) {
  const file = input.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    // Сжимаем фото
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const MAX_WIDTH = 400;
      let width = img.width;
      let height = img.height;
      if (width > MAX_WIDTH) { height = Math.round((height * MAX_WIDTH) / width); width = MAX_WIDTH; }
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      const base64 = canvas.toDataURL('image/jpeg', 0.7);

      // Отправляем на сервер
      fetch('/api/upload_photo', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ email: currentUser.email, photo_base64: base64 })
      }).then(() => {
        currentUser.photo = base64;
        currentUser.status = 'pending';
        updatePassportUI();
        alert('Фото отправлено на проверку админу!');
      });
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// Панель админа
function loadPending() {
  fetch('/api/pending_list').then(r => r.json()).then(data => {
    const box = document.getElementById('pending-list');
    box.innerHTML = '';
    if (data.length === 0) {
      box.innerText = 'Нет заявок на проверку.';
      return;
    }
    data.forEach(u => {
      const item = document.createElement('div');
      item.className = 'pending-item';
      item.innerHTML = `
        <div style="display:flex; align-items:center; gap:10px">
          <img src="${u.photo_base64}" class="pending-photo">
          <b>${u.display_name || u.name}</b>
        </div>
        <button style="width:auto; padding:8px 15px; background:#C6FF00; color:#000" onclick="approve('${u.email}')">Одобрить</button>
      `;
      box.appendChild(item);
    });
  });
}

function approve(email) {
  fetch('/api/approve', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ targetEmail: email, adminPass: '1495' })
  }).then(() => {
    loadPending(); // обновляем список
    
    // Если админ одобрил сам себя (для теста), обновляем и его карточку
    if (email === currentUser.email) {
      currentUser.status = 'approved';
      updatePassportUI();
    }
  });
}
</script>
</body>
</html>
